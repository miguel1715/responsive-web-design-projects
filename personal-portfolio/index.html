<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miguel Cruz | Portfolio</title>
    <meta name="description" content="Portfolio of Miguel Cruz, an aspiring web developer based in Portugal.">

    <!-- Inter font (weights 300 to 700) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body class="debug"> <!-- delete the class="debug" at the end -->

    <!-- ===== NAVIGATION: 2 links | menu button | 2 links ===== -->
    <header class="site-header">
        <nav class="island" aria-label="Main">

            <!-- left side: 2 links -->
            <ul class="nav-links nav-links-left">
                <li><a href="#about">About</a></li>
                <li><a href="#projects">Projects</a></li>
            </ul>

            <!-- centre: the three-stripe button (JS will toggle aria-expanded later) -->
            <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- right side: 2 links -->
            <ul class="nav-links nav-links-right">
                <li><a href="#learning">Learning</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>

        </nav>
    </header>

    <main>
        <!-- ===== HERO: the first thing a visitor sees ===== -->
        <section class="hero" id="top">

            <!-- h1 and p div center text -->
            <div class="hero-intro">
                <h1 class="hero-title">Hi, I'm<br>Miguel<span class="dot">.</span></h1>
                <p class="hero-sub">On a journey into <span class="brush">web development</span>.</p>
            </div>

            <!-- bottom row div: clock (left), arrow (centre), location (right) -->
            <div class="hero-details">
                <p class="hero-clock">
                    <span id="clock-date">07 OUT 2026</span>
                    <span id="clock-hours">12</span><span class="clock-colon">:</span><span id="clock-minutes">34</span>
                </p>
                <!-- ↓ is a placeholder; we swap it for an SVG arrow later -->
                <a class="scroll-arrow" href="#about" aria-label="Scroll down">↓</a>
                <p class="hero-location">Based in Portugal</p>
            </div>
        </section>

    <script src="script.js" defer></script>

</body>
</html>
